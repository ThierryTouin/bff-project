<div style="text-align:center">
  <h1>Welcome to the Angular BFF Example!</h1>
  
  <!-- Affichage du GTM-ID actuel -->
  <!-- <div *ngIf="gtmId" style="background-color: #f0f0f0; padding: 10px; margin: 10px 0;"> -->
  <div>
    <strong>GTM ID:</strong> {{ gtmId }}
  </div>
  
  <button (click)="login()">Login</button>
  <button (click)="logout()">Logout</button><br>
  <button (click)="swagger()">Doc API</button><br>
  <button (click)="userInfo()">UserInfo</button><br>
  <button (click)="callDirectPublicApi()">Call Direct Public API</button>
  <button (click)="callDirectSecuApi()">Call Direct Secured API</button><br>
  <button (click)="callNginxPublicApi()">Call Nginx Public API</button>
  <button (click)="callNginxSecuHello()">Call Nginx Secured API</button><br>
  <button (click)="postNginxSecuHello()">Post Nginx Secured API</button><br>  
  <p>{{ helloMessage }}</p>
</div>
